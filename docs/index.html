а турнике прямым хватом чуть шире плеч.","Опустите лопатки вниз и напрягите пресс.","Подтянитесь грудью к перекладине, пока подбородок не окажется над ней.","Опуститесь до полностью прямых рук."],tip:"Пока не получается подтянуться, делайте медленные опускания сверху или подтягивайтесь с резинкой."},{id:"chinup",m:{p:["lats","biceps"],s:["upperback","forearms"]},name:"Подтягивания обратным хватом",g:"back",also:["biceps"],pat:"vpull",type:"c",eq:[["bar"]],lvl:2,anim:"chinup",bw:!0,steps:["Повисните обратным хватом на ширине плеч.","Опустите плечи подальше от ушей.","Подтянитесь до подбородка над перекладиной, локти идут к рёбрам.","Медленно опуститесь в полный вис."],tip:"Не раскачивайтесь и не помогайте ногами: контроль важнее количества."},{id:"lat_pulldown",m:{p:["lats"],s:["biceps","upperback"]},name:"Тяга верхнего блока",g:"back",also:["biceps"],pat:"vpull",type:"c",eq:[["machines"]],lvl:1,anim:"latPulldown",steps:["Сядьте, зафиксируйте бёдра под валиками и возьмите гриф чуть шире плеч.","Слегка отклонитесь назад и раскройте грудь.","Тяните гриф к верху груди, ведя локти вниз.","Медленно отпустите гриф вверх до прямых рук."],tip:"Не тяните гриф за голову и не раскачивайте корпус."},{id:"row_bb",m:{p:["lats","upperback"],s:["biceps","rearDelts","lowerback"]},name:"Тяга штанги в наклоне",g:"back",also:["biceps"],pat:"hpull",type:"c",eq:[["barbell"]],lvl:2,anim:"rowBB",steps:["Возьмите штангу на ширине плеч и наклонитесь примерно на 45°, колени слегка согнуты.","Спина прямая, штанга висит под плечами.","Тяните штангу к низу рёбер, сводя лопатки.","Подконтрольно опустите её, не выпрямляясь."],tip:"Если поясница округляется, уменьшите вес и наклон."},{id:"row_db",m:{p:["lats","upperback"],s:["biceps","rearDelts"]},name:"Тяга гантели одной рукой",g:"back",also:["biceps"],pat:"hpull",type:"c",eq:[["dumbbells"]],lvl:1,anim:"rowDB",side:!0,steps:["Упритесь рукой в скамью или устойчивую опору, ноги врозь, спина прямая.","Гантель в свободной руке висит прямо вниз.","Тяните гантель к бедру, локоть близко к корпусу.","Медленно опустите до растяжения. Сделайте все повторы и смените сторону."],tip:"Тяните к бедру, а не к подмышке: так работает спина, а не рука."},{id:"cable_row",m:{p:["lats","upperback"],s:["biceps","rearDelts"]},name:"Тяга нижнего блока сидя",g:"back",also:["biceps"],pat:"hpull",type:"c",eq:[["machines"]],lvl:1,anim:"cableRow",steps:["Сядьте, стопы на платформе, колени чуть согнуты, возьмите рукоять.","Начните с прямыми руками и небольшим наклоном вперёд.","Выпрямитесь и тяните рукоять к животу, сводя лопатки.","Медленно отпустите рукоять вперёд."],tip:"Корпус двигается совсем немного. Тянут руки и спина."},{id:"band_row",m:{p:["lats","upperback"],s:["biceps","rearDelts"]},name:"Тяга резинки к поясу",g:"back",also:["biceps"],pat:"hpull",type:"c",eq:[["bands"]],lvl:1,anim:"bandRow",steps:["Закрепите резинку на уровне груди, например в закрытой двери.","Отойдите, чтобы резинка натянулась при прямых руках.","Тяните руки к рёбрам, сводя лопатки.","Медленно выпрямите руки."],tip:"Чем дальше от точки крепления, тем тяжелее."},{id:"door_row",m:{p:["lats","upperback"],s:["biceps","rearDelts"]},name:"Тяга в дверном проёме",g:"back",also:["biceps"],pat:"hpull",type:"c",eq:[[]],lvl:1,anim:"doorRow",bw:!0,steps:["Встаньте лицом к открытому прочному дверному проёму и возьмитесь за косяки на уровне груди.","Подойдите стопами ближе к проёму и отклонитесь назад до прямых рук, тело прямое.","Подтяните грудь к косякам, сводя лопатки.","Медленно вернитесь назад."],tip:"Чем сильнее отклонение, тем тяжелее. Сначала убедитесь, что косяк прочный и хват надёжный."},{id:"superman",m:{p:["lowerback"],s:["glutes","hams","upperback"]},name:"Супермен",g:"back",also:["glutes"],pat:"backiso",type:"i",eq:[[]],lvl:1,anim:"superman",bw:!0,steps:["Лягте на живот, руки вытянуты вперёд, ноги прямые.","Напрягите ягодицы и слегка пресс.","Поднимите руки, грудь и ноги на несколько сантиметров от пола.","Задержитесь на секунду и подконтрольно опуститесь."],tip:"Смотрите в пол, а не вперёд, чтобы шея оставалась длинной."},{id:"deadlift",m:{p:["glutes","hams","lowerback"],s:["quads","traps","lats","forearms"]},name:"Становая тяга",g:"back",also:["legs","glutes"],pat:"hinge",type:"c",eq:[["barbell"]],lvl:3,anim:"deadlift",steps:["Встаньте так, чтобы гриф был над серединой стопы, стопы на ширине таза.","Наклонитесь и возьмите гриф сразу снаружи ног, голени касаются грифа.","Напрягите корпус, выпрямите спину и оттолкните пол, пока не выпрямитесь.","Опускайте штангу, отводя таз назад и держа гриф близко к ногам."],tip:"В начале подъёма угол спины не меняется: не давайте тазу подняться раньше штанги."},{id:"face_pull",m:{p:["rearDelts","upperback"],s:["traps"]},name:"Тяга каната к лицу",g:"shoulders",also:["back"],pat:"rear",type:"i",eq:[["machines"]],lvl:1,anim:"facePull",steps:["Установите канат на уровне лица и возьмитесь большими пальцами назад.","Отойдите, чтобы руки были прямыми, а трос натянут.","Тяните канат к лицу, локти высоко и широко.","Задержитесь и медленно вернитесь."],tip:"В конце кисти у ушей, как будто показываете бицепс."},{id:"band_pullapart",m:{p:["rearDelts","upperback"],s:["traps"]},name:"Разведение резинки",g:"shoulders",also:["back"],pat:"rear",type:"i",eq:[["bands"]],lvl:1,anim:"bandPullApart",steps:["Держите резинку перед собой на уровне плеч, хват на ширине плеч.","Руки почти прямые.","Разведите резинку, пока она не коснётся груди.","Медленно вернитесь, не давая резинке дёрнуть руки."],tip:"Всё время держите плечи опущенными, подальше от ушей."},{id:"ohp_bb",m:{p:["delts"],s:["triceps","traps","abs"]},name:"Жим штанги стоя",g:"shoulders",also:["triceps"],pat:"vpush",type:"c",eq:[["barbell"]],lvl:2,anim:"ohp",steps:["Держите штангу у ключиц, хват чуть шире плеч.","Напрягите ягодицы и пресс.","Выжмите штангу прямо вверх, слегка отводя голову назад, чтобы пропустить гриф.","Зафиксируйте штангу над серединой стопы и опустите к ключицам."],tip:"Не прогибайтесь назад, чтобы дожать: рёбра держите опущенными."},{id:"shoulder_press_db",m:{p:["delts"],s:["triceps"]},name:"Жим гантелей сидя",g:"shoulders",also:["triceps"],pat:"vpush",type:"c",eq:[["dumbbells"]],lvl:1,anim:"dbPress",steps:["Сядьте прямо, гантели на уровне плеч, ладони вперёд.","Если есть спинка, прижмитесь к ней.","Выжмите гантели вверх до прямых рук.","Подконтрольно опустите их до уровня ушей."],tip:"Не соединяйте гантели вверху, чтобы мышцы оставались под нагрузкой."},{id:"lateral_raise",m:{p:["delts"],s:["traps"]},name:"Махи гантелями в стороны",g:"shoulders",also:[],pat:"raise",type:"i",eq:[["dumbbells"]],lvl:1,anim:"latRaise",steps:["Встаньте прямо с лёгкими гантелями по бокам.","Слегка согнув локти, поднимите гантели в стороны.","Остановитесь на уровне плеч, мизинцы на уровне больших пальцев.","Медленно опустите."],tip:"Берите вес, который поднимаете без рывков и без подъёма плеч к ушам."},{id:"band_lateral",m:{p:["delts"],s:["traps"]},name:"Махи с резинкой в стороны",g:"shoulders",also:[],pat:"raise",type:"i",eq:[["bands"]],lvl:1,anim:"latRaiseBand",steps:["Встаньте на середину резинки, концы в руках.","Локти слегка согнуты.","Поднимите руки в стороны до уровня плеч.","Медленно опустите, сопротивляясь резинке."],tip:"Укоротите резинку, чтобы добавить сопротивление."},{id:"pike_pushup",m:{p:["delts"],s:["triceps","chest"]},name:"Отжимания уголком",g:"shoulders",also:["triceps"],pat:"vpush",type:"c",eq:[[]],lvl:2,anim:"pike",bw:!0,steps:["Из упора лёжа подойдите стопами ближе и поднимите таз, чтобы тело стало перевёрнутой буквой V.","Ладони на ширине плеч, голова между руками.","Согните локти и опустите макушку к полу.","Выжмите себя до прямых рук."],tip:"Чем выше таз, тем сильнее работают плечи."},{id:"curl_bb",m:{p:["biceps"],s:["forearms"]},name:"Подъём штанги на бицепс",g:"biceps",also:[],pat:"curl",type:"i",eq:[["barbell"]],lvl:1,anim:"curlBB",steps:["Встаньте прямо, возьмите штангу обратным хватом на ширине плеч.","Прижмите локти к бокам.","Согните руки, поднимая штангу к плечам.","Медленно опустите до прямых рук."],tip:"Не раскачивайте корпус. Если без рывка не получается, вес слишком большой."},{id:"curl_db",m:{p:["biceps"],s:["forearms"]},name:"Подъём гантелей на бицепс",g:"biceps",also:[],pat:"curl",type:"i",eq:[["dumbbells"]],lvl:1,anim:"curlDB",steps:["Встаньте с гантелями в руках, ладони смотрят вперёд.","Локти держите у боков.","Согните руки, вверху слегка разворачивая мизинец вверх.","Подконтрольно опустите до конца."],tip:"Полная амплитуда для роста бицепса важнее большого веса."},{id:"hammer_curl",m:{p:["biceps","forearms"],s:[]},name:"Молотковые сгибания",g:"biceps",also:[],pat:"curl",type:"i",eq:[["dumbbells"]],lvl:1,anim:"curlDB",steps:["Держите гантели по бокам, ладони смотрят друг на друга.","Локти неподвижны у боков.","Согните руки, не поворачивая кисти.","Медленно опустите до прямых рук."],tip:"Такой хват дополнительно нагружает предплечья и внешнюю часть руки."},{id:"band_curl",m:{p:["biceps"],s:["forearms"]},name:"Сгибания рук с резинкой",g:"biceps",also:[],pat:"curl",type:"i",eq:[["bands"]],lvl:1,anim:"curlBand",steps:["Встаньте на резинку и возьмите концы ладонями вперёд.","Прижмите локти к бокам.","Согните руки, поднимая кисти к плечам.","Медленно опустите, сопротивляясь резинке."],tip:"Задержитесь и напрягите мышцу вверху, где резинка натянута сильнее всего."},{id:"pushdown",m:{p:["triceps"],s:[]},name:"Разгибание рук на блоке",g:"triceps",also:[],pat:"ext",type:"i",eq:[["machines"]],lvl:1,anim:"pushdown",steps:["Встаньте лицом к верхнему блоку с прямой рукоятью или канатом, слегка наклонитесь вперёд.","Прижмите локти к бокам.","Разогните руки вниз до конца.","Дайте рукояти подняться, пока предплечья не будут чуть выше параллели, локти неподвижны."],tip:"Двигаются только предплечья, плечи не участвуют."},{id:"band_pushdown",m:{p:["triceps"],s:[]},name:"Разгибание рук с резинкой",g:"triceps",also:[],pat:"ext",type:"i",eq:[["bands"]],lvl:1,anim:"pushdownBand",steps:["Закрепите резинку высоко, например над дверью.","Возьмите резинку, локти прижаты к бокам.","Разогните руки вниз до конца.","Медленно дайте предплечьям подняться."],tip:"В нижней точке каждый раз сильно напрягайте трицепс."},{id:"oh_ext_db",m:{p:["triceps"],s:[]},name:"Разгибание гантели из-за головы",g:"triceps",also:[],pat:"ext",type:"i",eq:[["dumbbells"]],lvl:1,anim:"ohExt",steps:["Держите одну гантель двумя руками над головой, руки прямые.","Плечи прижаты к голове.","Согните локти и опустите гантель за голову.","Разогните руки, поднимая её обратно."],tip:"Держите рёбра опущенными, чтобы поясница не прогибалась."},{id:"bench_dip",m:{p:["triceps"],s:["chest","frontDelts"]},name:"Обратные отжимания от скамьи",g:"triceps",also:["chest"],pat:"ext",type:"c",eq:[[]],lvl:1,anim:"benchDip",bw:!0,steps:["Сядьте на край скамьи или прочного стула, ладони рядом с бёдрами.","Сместите таз вперёд с края, ноги вытянуты.","Сгибайте локти строго назад, опуская тело.","Выжмите себя вверх до прямых рук."],tip:"Опускайтесь, пока плечо не станет параллельно полу, чтобы беречь плечевые суставы."},{id:"close_pushup",m:{p:["triceps"],s:["chest","frontDelts"]},name:"Отжимания узким хватом",g:"triceps",also:["chest"],pat:"ext",type:"c",eq:[[]],lvl:2,anim:"pushup",bw:!0,steps:["Примите упор лёжа, ладони под плечами.","Локти держите близко к рёбрам.","Опустите грудь к кистям.","Выжмите себя до прямых рук."],tip:"Если тело перестаёт быть прямым, делайте их с колен."},{id:"squat_bb",m:{p:["quads","glutes"],s:["hams","lowerback","abs"]},name:"Приседания со штангой",g:"legs",also:["glutes"],pat:"squat",type:"c",eq:[["barbell"]],lvl:2,anim:"squatBB",steps:["Положите гриф на верх спины, стопы на ширине плеч, носки слегка врозь.","Напрягите пресс, грудь вверх.","Сядьте вниз и назад, пока таз не окажется на уровне колен или ниже.","Встаньте, отталкиваясь всей стопой, колени идут по линии носков."],tip:"Приседайте в силовой раме со страховочными упорами чуть ниже нижней точки."},{id:"goblet",m:{p:["quads","glutes"],s:["abs","upperback"]},name:"Гоблет-приседания",g:"l
