ивайтесь и не помогайте ногами: контроль важнее количества."},{id:"lat_pulldown",m:{p:["lats"],s:["biceps","upperback"]},name:"Тяга верхнего блока",g:"back",also:["biceps"],pat:"vpull",type:"c",eq:[["machines"]],lvl:1,anim:"latPulldown",steps:["Сядьте, зафиксируйте бёдра под валиками и возьмите гриф чуть шире плеч.","Слегка отклонитесь назад и раскройте грудь.","Тяните гриф к верху груди, ведя локти вниз.","Медленно отпустите гриф вверх до прямых рук."],tip:"Не тяните гриф за голову и не раскачивайте корпус."},{id:"row_bb",m:{p:["lats","upperback"],s:["biceps","rearDelts","lowerback"]},name:"Тяга штанги в наклоне",g:"back",also:["biceps"],pat:"hpull",type:"c",eq:[["barbell"]],lvl:2,anim:"rowBB",steps:["Возьмите штангу на ширине плеч и наклонитесь примерно на 45°, колени слегка согнуты.","Спина прямая, штанга висит под плечами.","Тяните штангу к низу рёбер, сводя лопатки.","Подконтрольно опустите её, не выпрямляясь."],tip:"Если поясница округляется, уменьшите вес и наклон."},{id:"row_db",m:{p:["lats","upperback"],s:["biceps","rearDelts"]},name:"Тяга гантели одной рукой",g:"back",also:["biceps"],pat:"hpull",type:"c",eq:[["dumbbells"]],lvl:1,anim:"rowDB",side:!0,steps:["Упритесь рукой в скамью или устойчивую опору, ноги врозь, спина прямая.","Гантель в свободной руке висит прямо вниз.","Тяните гантель к бедру, локоть близко к корпусу.","Медленно опустите до растяжения. Сделайте все повторы и смените сторону."],tip:"Тяните к бедру, а не к подмышке: так работает спина, а не рука."},{id:"cable_row",m:{p:["lats","upperback"],s:["biceps","rearDelts"]},name:"Тяга нижнего блока сидя",g:"back",also:["biceps"],pat:"hpull",type:"c",eq:[["machines"]],lvl:1,anim:"cableRow",steps:["Сядьте, стопы на платформе, колени чуть согнуты, возьмите рукоять.","Начните с прямыми руками и небольшим наклоном вперёд.","Выпрямитесь и тяните рукоять к животу, сводя лопатки.","Медленно отпустите рукоять вперёд."],tip:"Корпус двигается совсем немного. Тянут руки и спина."},{id:"band_row",m:{p:["lats" бокам, ладони смотрят друг на друга.","Локти неподвижны у боков.","Согните руки, не поворачивая кисти.","Медленно опустите до прямых рук."],tip:"Такой хват дополнительно нагружает предплечья и внешнюю часть руки."},{id:"band_curl",m:{p:["biceps"],s:["forearms"]},name:"Сгибания рук с резинкой",g:"biceps",also:[],pat:"curl",type:"i",eq:[["bands"]],lvl:1,anim:"curlBand",steps:["Встаньте на резинку и возьмите концы ладонями вперёд.","Прижмите локти к бокам.","Согните руки, поднимая кисти к плечам.","Медленно опустите, сопротивляясь резинке."],tip:"Задержитесь и напрягите мышцу вверху, где резинка натянута сильнее всего."},{id:"pushdown",m:{p:["triceps"],s:[]},name:"Разгибание рук на блоке",g:"triceps",also:[],pat:"ext",type:"i",eq:[["machines"]],lvl:1,anim:"pushdown",steps:["Встаньте лицом к верхнему блоку с прямой рукоятью или канатом, слегка наклонитесь вперёд.","Прижмите локти к бокам.","Разогните руки вниз до конца.","Дайте рукояти подняться, пока предплечья не будут чуть выше параллели, локти неподвижны."],tip:"Двигаются только предплечья, плечи не участвуют."},{id:"band_pushdown",m:{p:["triceps"],s:[]},name:"Разгибание рук с резинкой",g:"triceps",also:[],pat:"ext",type:"i",eq:[["bands"]],lvl:1,anim:"pushdownBand",steps:["Закрепите резинку высоко, например над дверью.","Возьмите резинку, локти прижаты к бокам.","Разогните руки вниз до конца.","Медленно дайте предплечьям подняться."],tip:"В нижней точке каждый раз сильно напрягайте трицепс."},{id:"oh_ext_db",m:{p:["triceps"],s:[]},name:"Разгибание гантели из-за головы",g:"triceps",also:[],pat:"ext",type:"i",eq:[["dumbbells"]],lvl:1,anim:"ohExt",steps:["Держите одну гантель двумя руками над головой, руки прямые.","Плечи прижаты к голове.","Согните локти и опустите гантель за голову.","Разогните руки, поднимая её обратно."],tip:"Держите рёбра опущенными, чтобы поясница не прогибалась."},{id:"bench_dip",m:{p:["triceps"],s:["chest","frontDelts"]},name:"Обратные отжимания от скамьи",g:"triceps",also:["chest"],pat:"ext",type:"c",eq:[[]],lvl:1,anim:"benchDip",bw:!0,steps:["Сядьте на край скамьи или прочного стула, ладони рядом с бёдрами.","Сместите таз вперёд с края, ноги вытянуты.","Сгибайте локти строго назад, опуская тело.","Выжмите себя вверх до прямых рук."],tip:"Опускайтесь, пока плечо не станет параллельно полу, чтобы беречь плечевые суставы."},{id:"close_pushup",m:{p:["triceps"],s:["chest","frontDelts"]},name:"Отжимания узким хватом",g:"triceps",also:["chest"],pat:"ext",type:"c",eq:[[]],lvl:2,anim:"pushup",bw:!0,steps:["Примите упор лёжа, ладони под плечами.","Локти держите близко к рёбрам.","Опустите грудь к кистям.","Выжмите себя до прямых рук."],tip:"Если тело перестаёт быть прямым, делайте их с колен."},{id:"squat_bb",m:{p:["quads","glutes"],s:["hams","lowerback","abs"]},name:"Приседания со штангой",g:"legs",also:["glutes"],pat:"squat",type:"c",eq:[["barbell"]],lvl:2,anim:"squatBB",steps:["Положите гриф на верх спины, стопы на ширине плеч, носки слегка врозь.","Напрягите пресс, грудь вверх.","Сядьте вниз и назад, пока таз не окажется на уровне колен или ниже.","Встаньте, отталкиваясь всей стопой, колени идут по линии носков."],tip:"Приседайте в силовой раме со страховочными упорами чуть ниже нижней точки."},{id:"goblet",m:{p:["quads","glutes"],s:["abs","upperback"]},name:"Гоблет-приседания",g:"legs",also:["glutes"],pat:"squat",type:"c",eq:[["dumbbells"]],lvl:1,anim:"goblet",steps:["Держите гантель вертикально у груди.","Стопы на ширине плеч, носки слегка врозь.","Присядьте между пятками, локти внутри коленей.","Встаньте, сохраняя грудь раскрытой."],tip:"Вес впереди помогает держать корпус прямо, поэтому с этих приседаний удобно начинать."},{id:"squat_bw",m:{p:["quads","glutes"],s:["hams"]},name:"Приседания без веса",g:"legs",also:["glutes"],pat:"squat",type:"c",eq:[[]],lvl:1,anim:"squat",bw:!0,steps:["Стопы на ширине плеч, носки слегка врозь.","Вытяните руки вперёд для баланса.","Отведите таз назад и вниз так низко, как получается с прямой спиной.","Встаньте, отталкиваясь пятками."],tip:"Опускайтесь за 3 секунды, чтобы усложнить упражнение."},{id:"leg_press",m:{p:["quads","glutes"],s:["hams"]},name:"Жим ногами",g:"legs",also:["glutes"],pat:"squat",type:"c",eq:[["machines"]],lvl:1,anim:"legPress",steps:["Сядьте, спина плотно на спинке, стопы на платформе на ширине таза.","Снимите фиксаторы и опустите платформу, сгибая колени.","Опускайтесь, пока поясница не начинает отрываться от спинки.","Выжмите платформу, не выпрямляя колени до замка."],tip:"Колени идут по линии носков и не заваливаются внутрь."},{id:"rdl_bb",m:{p:["hams","glutes"],s:["lowerback","forearms"]},name:"Румынская тяга",g:"legs",also:["glutes","back"],pat:"hinge",type:"c",eq:[["barbell"]],lvl:2,anim:"rdlBB",steps:["Встаньте прямо со штангой у бёдер, колени слегка согнуты.","Отводите таз назад, скользя грифом вдоль ног.","Остановитесь, когда почувствуете сильное растяжение задней поверхности бедра, спина прямая.","Напрягите ягодицы и выпрямитесь."],tip:"Это движение тазом: колени слегка согнуты и не приседают."},{id:"rdl_db",m:{p:["hams","glutes"],s:["lowerback","forearms"]},name:"Румынская тяга с гантелями",g:"legs",also:["glutes","back"],pat:"hinge",type:"c",eq:[["dumbbells"]],lvl:1,anim:"rdlDB",steps:["Держите гантели перед бёдрами, колени слегка согнуты.","Наклонитесь за счёт таза, ведя гантели близко к ногам.","Опускайтесь до растяжения задней поверхности бедра с прямой спиной.","Подайте таз вперёд и выпрямитесь."],tip:"Гантели почти касаются ног на протяжении всего движения."},{id:"lunge",m:{p:["quads","glutes"],s:["hams","calves"]},name:"Обратные выпады",g:"legs",also:["glutes"],pat:"lunge",type:"c",eq:[[]],lvl:1,anim:"lunge",bw:!0,side:!0,steps:["Встаньте прямо, стопы на ширине таза (для нагрузки возьмите гантели).","Шагните одной ногой назад и опуститесь, пока оба колена не согнутся примерно на 90°.","Переднее колено над стопой, корпус прямой.","Оттолкнитесь передней пяткой и вернитесь. Чередуйте ноги."],tip:"Шаг назад мягче для коленей, чем шаг вперёд."},{id:"s
